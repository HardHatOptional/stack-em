<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stack 'Em</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: #60a5fa;
        margin: 10px 0;
    }

    .board {
        display: grid;
        grid-template-columns: repeat(5, 74px);
        gap: 6px;
        width: 400px;
        margin: 20px auto;
        background: #1e2937;
        padding: 15px;
        border-radius: 12px;
    }

    .cell {
        width: 74px;
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        position: relative;
        user-select: none;
    }

    .red {
        background: #b91c1c;
        color: #fee2e2;
    }

    .blue {
        background: #1d4ed8;
        color: #dbeafe;
    }

    .empty {
        background: #334155;
    }

    .selected {
        box-shadow: 0 0 0 6px #fde047 inset;
    }

    .valid {
        box-shadow: 0 0 0 6px #4ade80 inset;
    }

    .height-label {
        position: absolute;
        top: 6px;
        right: 8px;
        font-size: 16px;
        background: rgba(0,0,0,0.5);
        padding: 2px 6px;
        border-radius: 50%;
    }

    button {
        padding: 12px 24px;
        font-size: 1.05em;
        background: #334155;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px;
    }

    #log {
        max-width: 420px;
        margin: 20px auto;
        text-align: left;
        background: #1e2937;
        padding: 12px;
        border-radius: 8px;
        max-height: 200px;
        overflow-y: auto;
    }

    @media (max-width: 500px) {
        .board {
            width: 100%;
            grid-template-columns: repeat(5, 1fr);
        }

        .cell {
            width: 100%;
            aspect-ratio: 1/1;
            font-size: 22px;
        }
    }
</style>
</head>

<body>

<h1>STACK 'EM</h1>

<p id="status" style="font-size:1.2em;"></p>

<div id="board" class="board"></div>

<button onclick="newGame()">New Game</button>
<button onclick="copyLink()">Share Link</button>

<div id="log"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue,
    get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBSHHztyiMchOW0bH-QicF10ze6yZvPoVk",
    authDomain: "stacks-77d0c.firebaseapp.com",
    databaseURL: "https://stacks-77d0c-default-rtdb.firebaseio.com",
    projectId: "stacks-77d0c",
    storageBucket: "stacks-77d0c.firebasestorage.app",
    messagingSenderId: "1002747782009",
    appId: "1:1002747782009:web:220d4ae677e5f32cff45a8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomId = new URLSearchParams(window.location.search).get("room");

if (!roomId) {
    roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
    window.history.replaceState({}, "", "?room=" + roomId);
}

let playerColor = null;

let board = [];
let currentPlayer = 'R';
let graveyards = { 'R': 0, 'B': 0 };
let selected = null;

const roomRef = ref(db, "rooms/" + roomId);

async function assignPlayer() {

    const snapshot = await get(roomRef);

    if (!snapshot.exists()) {

        playerColor = 'R';

        createFreshBoard();

        syncState();

    } else {

        const data = snapshot.val();

        if (!data.player2Joined) {

            playerColor = 'B';

            await set(ref(db, `rooms/${roomId}/player2Joined`), true);

        } else {

            alert("Room full.");

        }
    }

    log(`You are ${playerColor === 'R' ? '🔴 RED' : '🔵 BLUE'}`, true);
}

function syncState() {

    set(roomRef, {
        board,
        currentPlayer,
        graveyards,
        player2Joined: true
    });
}

onValue(roomRef, (snapshot) => {

    const data = snapshot.val();

    if (!data) return;

    board = data.board;
    currentPlayer = data.currentPlayer;
    graveyards = data.graveyards;

    render();
});

function shuffle(arr) {

    for (let i = arr.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function createFreshBoard() {

    board = Array(5).fill().map(() => Array(5).fill(null));

    graveyards = { 'R': 0, 'B': 0 };

    currentPlayer = 'R';

    selected = null;

    let redPos = [
        [4,0],[4,1],[4,2],[4,3],
        [3,0],[3,1],[3,2],[2,1]
    ];

    const redHeights = [3,2,1,1,1];

    shuffle(redPos);

    for (let i = 0; i < 5; i++) {

        let [r,c] = redPos[i];

        board[r][c] = {
            p: 'R',
            h: redHeights[i % 5]
        };
    }

    let bluePos = [
        [0,1],[0,2],[0,3],
        [1,0],[1,2],[1,4],[0,4]
    ];

    shuffle(bluePos);

    for (let i = 0; i < 5; i++) {

        let [r,c] = bluePos[i];

        let h = [1,1,2,2,3][Math.floor(Math.random()*5)];

        board[r][c] = {
            p: 'B',
            h: h
        };
    }

    document.getElementById('log').innerHTML = '';
}

function render() {

    const boardEl = document.getElementById('board');

    boardEl.innerHTML = '';

    for (let r = 0; r < 5; r++) {

        for (let c = 0; c < 5; c++) {

            const cell = document.createElement('div');

            const stack = board[r][c];

            cell.className =
                `cell ${stack ? (stack.p === 'R' ? 'red' : 'blue') : 'empty'}`;

            cell.dataset.r = r;
            cell.dataset.c = c;

            if (stack) {

                cell.innerHTML =
                    `${stack.p}${stack.h}<span class="height-label">${stack.h}</span>`;
            }

            cell.onclick = () => handleClick(r, c);

            boardEl.appendChild(cell);
        }
    }

    const color =
        currentPlayer === 'R'
            ? '#fca5a5'
            : '#93c5fd';

    document.getElementById('status').innerHTML = `
        Room: <strong>${roomId}</strong><br>
        You Are:
        <strong>
        ${playerColor === 'R' ? '🔴 RED' : '🔵 BLUE'}
        </strong><br>
        Current Turn:
        <strong style="color:${color}">
        ${currentPlayer === 'R' ? '🔴 RED' : '🔵 BLUE'}
        </strong>
    `;
}

function handleClick(r, c) {

    if (currentPlayer !== playerColor) {
        return;
    }

    if (selected) {

        attemptMove(selected.r, selected.c, r, c);

        selected = null;

        clearHighlights();

    } else if (
        board[r][c] &&
        board[r][c].p === currentPlayer
    ) {

        selected = {r, c};

        highlightValidMoves(r, c);
    }
}

function clearHighlights() {

    document
        .querySelectorAll('.cell')
        .forEach(cell => {

            cell.classList.remove('selected', 'valid');
        });
}

function highlightValidMoves(sr, sc) {

    document
        .querySelectorAll('.cell')
        .forEach(cell => {

            const r = parseInt(cell.dataset.r);

            const c = parseInt(cell.dataset.c);

            if (isValidMove(sr, sc, r, c)) {

                cell.classList.add('valid');
            }
        });

    document
        .querySelector(`.cell[data-r="${sr}"][data-c="${sc}"]`)
        .classList.add('selected');
}

function isValidMove(sr, sc, er, ec) {

    if (sr === er && sc === ec) return false;

    const dr = Math.abs(er - sr);

    const dc = Math.abs(ec - sc);

    const M = Math.max(dr, dc);

    if (M > board[sr][sc].h) return false;

    if (M === 1) return true;

    return dr === 0 || dc === 0;
}

function attemptMove(sr, sc, er, ec) {

    if (!isValidMove(sr, sc, er, ec)) {

        return log("❌ Invalid move", true);
    }

    const attacker = board[sr][sc];

    const M =
        Math.max(
            Math.abs(er - sr),
            Math.abs(ec - sc)
        );

    const target = board[er][ec];

    if (
        target &&
        target.p !== attacker.p &&
        M === attacker.h
    ) {

        const D = target.h;

        graveyards[target.p] += D;

        let revive = Math.max(0, D - M);

        let newH = M;

        if (
            revive > 0 &&
            graveyards[attacker.p] >= revive
        ) {

            graveyards[attacker.p] -= revive;

            newH += revive;
        }

        board[er][ec] = {
            p: attacker.p,
            h: newH
        };

        log(`⚔️ Capture!`, true);

    } else {

        if (
            target &&
            target.p !== attacker.p
        ) {

            return log("❌ Cannot partial attack!", true);
        }

        const newH =
            M + (target ? target.h : 0);

        board[er][ec] = {
            p: attacker.p,
            h: newH
        };
    }

    const remaining = attacker.h - M;

    if (remaining > 0) {

        board[sr][sc].h = remaining;

    } else {

        board[sr][sc] = null;
    }

    currentPlayer =
        currentPlayer === 'R'
            ? 'B'
            : 'R';

    syncState();

    render();

    if (checkWin()) {

        alert(
            `${currentPlayer === 'R' ? 'BLUE' : 'RED'} wins!`
        );
    }
}

function checkWin() {

    let red = 0;

    let blue = 0;

    board.flat().forEach(s => {

        if (s) {

            s.p === 'R'
                ? red += s.h
                : blue += s.h;
        }
    });

    return red === 0 || blue === 0;
}

function log(msg, important = false) {

    const logEl = document.getElementById('log');

    const entry = document.createElement('div');

    entry.textContent = `> ${msg}`;

    if (important) {

        entry.style.color = '#facc15';
    }

    logEl.appendChild(entry);

    logEl.scrollTop = logEl.scrollHeight;
}

window.copyLink = function () {

    navigator.clipboard.writeText(window.location.href);

    alert("✅ Link copied!");
};

window.newGame = function () {

    if (playerColor === 'R') {

        createFreshBoard();

        syncState();
    }
};

assignPlayer();

</script>

</body>
</html>
