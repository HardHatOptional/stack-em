<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stack 'Em Multiplayer v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}

.board {
    display:grid;
    grid-template-columns:repeat(5,74px);
    gap:6px;
    width:400px;
    margin:20px auto;
    background:#1e2937;
    padding:15px;
    border-radius:12px;
}

.cell {
    width:74px;
    height:74px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    border-radius:10px;
    cursor:pointer;
    position:relative;
}

.red { background:#b91c1c; }
.blue { background:#1d4ed8; }
.empty { background:#334155; }

.height {
    position:absolute;
    top:6px;
    right:8px;
    font-size:12px;
    background:rgba(0,0,0,0.5);
    padding:2px 5px;
    border-radius:6px;
}

button {
    padding:10px 14px;
    margin:6px;
    border-radius:8px;
    border:none;
    background:#334155;
    color:white;
    cursor:pointer;
}

#log {
    max-width:420px;
    margin:auto;
    text-align:left;
    background:#1e2937;
    padding:10px;
    border-radius:8px;
    max-height:160px;
    overflow-y:auto;
}
</style>
</head>

<body>

<h1>STACK 'EM v2</h1>

<div id="menu">
    <button onclick="createRoom()">Create Room (Host)</button>
</div>

<p id="room"></p>
<p id="player"></p>
<p id="status"></p>

<div id="board" class="board"></div>

<button onclick="copyLink()">Copy Invite Link</button>

<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyBSHHztyiMchOW0bH-QicF10ze6yZvPoVk",
    authDomain: "stacks-77d0c.firebaseapp.com",
    databaseURL: "https://stacks-77d0c-default-rtdb.firebaseio.com",
    projectId: "stacks-77d0c",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomId = new URLSearchParams(location.search).get("room");
let ref = null;

let board = [];
let turn = "R";
let me = null;
let selected = null;

// ---------------- ROOM CREATION (HOST ONLY) ----------------

function createRoom() {
    roomId = Math.random().toString(36).substring(2,8).toUpperCase();

    history.replaceState({}, "", "?room=" + roomId);

    ref = db.ref("rooms/" + roomId);

    me = "R";

    ref.set({
        board: createBoard(),
        turn: "R",
        players: { R: true, B: false }
    });

    document.getElementById("menu").style.display = "none";
    document.getElementById("room").innerText = "Room: " + roomId;
    document.getElementById("player").innerText = "You: RED (Host)";

    listen();
}

// ---------------- JOIN ROOM (GUEST ONLY) ----------------

function joinRoom() {

    if (!roomId) {
        document.body.innerHTML = "<h2>Missing room link</h2>";
        return;
    }

    ref = db.ref("rooms/" + roomId);

    ref.transaction(state => {

        if (!state) return state;

        if (!state.players.B) {
            state.players.B = true;
            me = "B";
        } else {
            me = "spectator";
        }

        return state;
    });

    document.getElementById("menu").style.display = "none";
    document.getElementById("room").innerText = "Room: " + roomId;

    listen();
}

// ---------------- SYNC ----------------

function listen() {
    ref.on("value", snap => {
        const data = snap.val();
        if (!data) return;

        board = data.board;
        turn = data.turn;

        render();
    });
}

// ---------------- BOARD ----------------

function createBoard() {
    let b = Array(5).fill().map(()=>Array(5).fill(null));

    let reds = [[4,0],[4,1],[4,2],[3,0],[3,1]];
    let blues = [[0,1],[0,2],[0,3],[1,0],[1,2]];

    reds.forEach((p,i)=>b[p[0]][p[1]]={p:"R",h:1+(i%3)});
    blues.forEach((p,i)=>b[p[0]][p[1]]={p:"B",h:1+(i%3)});

    return b;
}

// ---------------- MOVE RULES ----------------

function valid(sr,sc,er,ec){
    let a = board[sr][sc];
    if(!a) return false;

    let dr = Math.abs(er-sr);
    let dc = Math.abs(ec-sc);
    let M = Math.max(dr,dc);

    if(M === 0) return false;
    if(M > a.h) return false;
    if(M > 1 && dr !== 0 && dc !== 0) return false;

    return true;
}

// ---------------- MOVE (SAFE + LOCKED) ----------------

function move(sr,sc,er,ec){

    if(me !== turn) return;
    if(!valid(sr,sc,er,ec)) return;

    ref.transaction(state => {

        if(!state) return state;
        if(state.turn !== me) return state;
        if(!state.players?.[me]) return state;

        let b = state.board;

        let a = b[sr][sc];
        let t = b[er][ec];

        let M = Math.max(Math.abs(er-sr), Math.abs(ec-sc));

        if(t && t.p !== a.p){
            b[er][ec] = {p:a.p, h:a.h};
        } else {
            b[er][ec] = {p:a.p, h:a.h + (t ? t.h : 0)};
        }

        if(a.h - M > 0) b[sr][sc].h -= M;
        else b[sr][sc] = null;

        state.board = b;
        state.turn = state.turn === "R" ? "B" : "R";

        return state;
    });
}

// ---------------- UI ----------------

function render(){

    const el = document.getElementById("board");
    el.innerHTML = "";

    for(let r=0;r<5;r++){
        for(let c=0;c<5;c++){

            let cell = document.createElement("div");
            let v = board[r][c];

            cell.className = "cell " + (v ? (v.p==="R"?"red":"blue") : "empty");

            if(v){
                cell.innerHTML = v.p + v.h +
                    `<div class='height'>${v.h}</div>`;
            }

            cell.onclick = () => {

                if(turn !== me) return;

                if(!selected){
                    if(board[r][c]?.p === me) selected = {r,c};
                } else {
                    move(selected.r,selected.c,r,c);
                    selected = null;
                }
            };

            el.appendChild(cell);
        }
    }

    document.getElementById("status").innerText = "Turn: " + turn;
}

// ---------------- UTIL ----------------

function copyLink(){
    navigator.clipboard.writeText(location.href);
    alert("Invite copied");
}

// ---------------- BOOT ----------------

if (roomId) joinRoom();

</script>

</body>
</html>
