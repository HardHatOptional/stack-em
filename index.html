<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stack 'Em (Multiplayer Stable)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 { color: #60a5fa; }

.board {
    display: grid;
    grid-template-columns: repeat(5, 74px);
    gap: 6px;
    width: 400px;
    margin: 20px auto;
    background: #1e2937;
    padding: 15px;
    border-radius: 12px;
}

.cell {
    width: 74px;
    height: 74px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
}

.red { background: #b91c1c; }
.blue { background: #1d4ed8; }
.empty { background: #334155; }

.valid { box-shadow: 0 0 0 4px #4ade80 inset; }
.selected { box-shadow: 0 0 0 4px #fde047 inset; }

.height {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 14px;
    background: rgba(0,0,0,0.5);
    padding: 2px 5px;
    border-radius: 6px;
}

button {
    padding: 10px 18px;
    margin: 8px;
    border-radius: 8px;
    border: none;
    background: #334155;
    color: white;
    cursor: pointer;
}

#log {
    max-width: 420px;
    margin: 10px auto;
    text-align: left;
    background: #1e2937;
    padding: 10px;
    border-radius: 8px;
    max-height: 180px;
    overflow-y: auto;
}
</style>
</head>

<body>

<h1>STACK 'EM</h1>
<p id="status"></p>

<div id="board" class="board"></div>

<button onclick="copyLink()">Share Link</button>
<button onclick="newGameHost()">New Game (Host only)</button>

<div id="log"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getDatabase,
    ref,
    set,
    onValue,
    runTransaction,
    get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBSHHztyiMchOW0bH-QicF10ze6yZvPoVk",
    authDomain: "stacks-77d0c.firebaseapp.com",
    databaseURL: "https://stacks-77d0c-default-rtdb.firebaseio.com",
    projectId: "stacks-77d0c",
    storageBucket: "stacks-77d0c.firebasestorage.app",
    messagingSenderId: "1002747782009",
    appId: "1:1002747782009:web:220d4ae677e5f32cff45a8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomId = new URLSearchParams(window.location.search).get("room");
if (!roomId) {
    roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
    window.history.replaceState({}, "", "?room=" + roomId);
}

const roomRef = ref(db, "rooms/" + roomId);

let player = null;   // R or B
let board = [];
let turn = "R";
let selected = null;
let lastVersion = -1;

// ---------- INIT ----------
async function init() {
    const snap = await get(roomRef);

    if (!snap.exists()) {
        player = "R";
        createBoard();
        pushState();
    } else {
        const data = snap.val();

        player = data.playerB ? "spectator" : "B";

        if (player === "B") {
            set(ref(db, `rooms/${roomId}/playerB`), true);
        }
    }

    listen();
}

function listen() {
    onValue(roomRef, snap => {
        const data = snap.val();
        if (!data) return;

        // stale update protection
        if (data.version <= lastVersion) return;
        lastVersion = data.version;

        board = data.board;
        turn = data.turn;

        render();
    });
}

// ---------- GAME SETUP ----------
function createBoard() {
    board = Array(5).fill().map(() => Array(5).fill(null));

    let reds = [[4,0],[4,1],[4,2],[3,0],[3,1]];
    let blues = [[0,1],[0,2],[0,3],[1,0],[1,2]];

    shuffle(reds);
    shuffle(blues);

    reds.forEach((p,i)=> board[p[0]][p[1]] = {p:"R",h:1+(i%3)});
    blues.forEach((p,i)=> board[p[0]][p[1]] = {p:"B",h:1+(i%3)});
}

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
}

// ---------- SYNC ----------
function pushState() {
    runTransaction(roomRef, (current) => {
        return {
            board,
            turn,
            version: (current?.version || 0) + 1
        };
    });
}

// ---------- MOVE VALIDATION ----------
function valid(sr,sc,er,ec){
    if(!board[sr][sc]) return false;
    let p = board[sr][sc];
    let dr = Math.abs(er-sr);
    let dc = Math.abs(ec-sc);
    let M = Math.max(dr,dc);

    if(M === 0) return false;
    if(M > p.h) return false;
    if(M > 1 && dr !== 0 && dc !== 0) return false;

    return true;
}

// ---------- MOVE ----------
function move(sr,sc,er,ec){

    if(turn !== player) return;

    if(!valid(sr,sc,er,ec)) {
        log("Invalid move");
        return;
    }

    runTransaction(roomRef, (state) => {

        if(!state) return state;

        if(state.turn !== player) return state;

        let b = state.board;
        let a = b[sr][sc];
        let t = b[er][ec];

        let M = Math.max(Math.abs(er-sr), Math.abs(ec-sc));

        if(t && t.p !== a.p){
            b[er][ec] = {p:a.p,h:a.h};
        } else {
            b[er][ec] = {p:a.p,h:a.h + (t?t.h:0)};
        }

        if(a.h - M > 0) b[sr][sc].h -= M;
        else b[sr][sc] = null;

        state.board = b;
        state.turn = state.turn === "R" ? "B" : "R";
        state.version = (state.version || 0) + 1;

        return state;
    });
}

// ---------- UI ----------
function render(){
    const el = document.getElementById("board");
    el.innerHTML="";

    for(let r=0;r<5;r++){
        for(let c=0;c<5;c++){
            let cell=document.createElement("div");
            let v=board[r][c];

            cell.className="cell " + (v?v.p==="R"?"red":"blue":"empty");

            if(v){
                cell.innerHTML=v.p+v.h+
                `<div class='height'>${v.h}</div>`;
            }

            cell.onclick=()=>{
                if(!selected){
                    if(board[r][c]?.p===turn) selected={r,c};
                } else {
                    move(selected.r,selected.c,r,c);
                    selected=null;
                }
            };

            el.appendChild(cell);
        }
    }

    document.getElementById("status").innerText =
        `You: ${player} | Turn: ${turn}`;
}

// ---------- UTIL ----------
function log(msg){
    let d=document.createElement("div");
    d.textContent="> "+msg;
    document.getElementById("log").appendChild(d);
}

window.copyLink = ()=>{
    navigator.clipboard.writeText(window.location.href);
    alert("Copied");
};

window.newGameHost = ()=>{
    if(player!=="R") return;
    createBoard();
    pushState();
};

init();

</script>
</body>
</html>
