<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stack 'Em Multiplayer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 { color: #60a5fa; }

.board {
    display: grid;
    grid-template-columns: repeat(5, 74px);
    gap: 6px;
    width: 400px;
    margin: 20px auto;
    background: #1e2937;
    padding: 15px;
    border-radius: 12px;
}

.cell {
    width: 74px;
    height: 74px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
}

.red { background: #b91c1c; }
.blue { background: #1d4ed8; }
.empty { background: #334155; }

.height {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 14px;
    background: rgba(0,0,0,0.5);
    padding: 2px 5px;
    border-radius: 6px;
}

button {
    padding: 10px 18px;
    margin: 8px;
    border-radius: 8px;
    border: none;
    background: #334155;
    color: white;
    cursor: pointer;
}

#log {
    max-width: 420px;
    margin: 10px auto;
    text-align: left;
    background: #1e2937;
    padding: 10px;
    border-radius: 8px;
    max-height: 180px;
    overflow-y: auto;
}
</style>
</head>

<body>

<h1>STACK 'EM</h1>

<p id="room"></p>
<p id="player"></p>
<p id="status"></p>

<div id="board" class="board"></div>

<button onclick="copyLink()">Share Link</button>

<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyBSHHztyiMchOW0bH-QicF10ze6yZvPoVk",
    authDomain: "stacks-77d0c.firebaseapp.com",
    databaseURL: "https://stacks-77d0c-default-rtdb.firebaseio.com",
    projectId: "stacks-77d0c",
    storageBucket: "stacks-77d0c.firebasestorage.app",
    messagingSenderId: "1002747782009",
    appId: "1:1002747782009:web:220d4ae677e5f32cff45a8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomId = new URLSearchParams(location.search).get("room");
if (!roomId) {
    roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
    history.replaceState({}, "", "?room=" + roomId);
}

document.getElementById("room").innerText = "Room: " + roomId;

let ref = db.ref("rooms/" + roomId);

let board = [];
let turn = "R";
let me = null;
let selected = null;
let initialized = false;

// ---------------- ROOM JOIN LOGIC ----------------

async function joinRoom() {
    const snap = await ref.get();

    if (!snap.exists()) {
        // FIRST PLAYER = HOST
        me = "R";

        board = createBoard();

        await ref.set({
            board,
            turn,
            players: { R: true, B: false }
        });

        log("You are RED (host)", true);
        initialized = true;

    } else {
        const data = snap.val();

        if (!data.players.B) {
            me = "B";

            await ref.update({
                "players/B": true
            });

            log("You are BLUE (guest)", true);
            initialized = true;

        } else {
            me = "spectator";
            log("Room full", true);
            return;
        }
    }

    listen();
}

// ---------------- SYNC ----------------

function listen() {
    ref.on("value", snap => {
        const data = snap.val();
        if (!data) return;

        board = data.board;
        turn = data.turn;

        render();
    });
}

// ---------------- BOARD ----------------

function createBoard() {
    let b = Array(5).fill().map(() => Array(5).fill(null));

    let reds = [[4,0],[4,1],[4,2],[3,0],[3,1]];
    let blues = [[0,1],[0,2],[0,3],[1,0],[1,2]];

    reds.forEach((p,i)=> b[p[0]][p[1]] = {p:"R",h:1+(i%3)});
    blues.forEach((p,i)=> b[p[0]][p[1]] = {p:"B",h:1+(i%3)});

    return b;
}

// ---------------- MOVE ----------------

function valid(sr,sc,er,ec){
    let a = board[sr][sc];
    if(!a) return false;

    let dr = Math.abs(er-sr);
    let dc = Math.abs(ec-sc);
    let M = Math.max(dr,dc);

    if(M === 0) return false;
    if(M > a.h) return false;
    if(M > 1 && dr !== 0 && dc !== 0) return false;

    return true;
}

async function move(sr,sc,er,ec){

    if(turn !== me) return;

    if(!valid(sr,sc,er,ec)) {
        log("Invalid move");
        return;
    }

    await ref.transaction(state => {

        if(!state) return state;
        if(state.turn !== me) return state;

        let b = state.board;

        let a = b[sr][sc];
        let t = b[er][ec];

        let M = Math.max(Math.abs(er-sr), Math.abs(ec-sc));

        if(t && t.p !== a.p){
            b[er][ec] = {p:a.p,h:a.h};
        } else {
            b[er][ec] = {p:a.p,h:a.h + (t?t.h:0)};
        }

        if(a.h - M > 0) b[sr][sc].h -= M;
        else b[sr][sc] = null;

        state.board = b;
        state.turn = state.turn === "R" ? "B" : "R";

        return state;
    });
}

// ---------------- UI ----------------

function render(){
    let el = document.getElementById("board");
    el.innerHTML = "";

    for(let r=0;r<5;r++){
        for(let c=0;c<5;c++){
            let cell = document.createElement("div");
            let v = board[r][c];

            cell.className = "cell " + (v ? (v.p==="R"?"red":"blue") : "empty");

            if(v){
                cell.innerHTML = v.p + v.h +
                    `<div class='height'>${v.h}</div>`;
            }

            cell.onclick = () => {
                if(turn !== me) return;

                if(!selected){
                    if(board[r][c]?.p === me) selected = {r,c};
                } else {
                    move(selected.r,selected.c,r,c);
                    selected = null;
                }
            };

            el.appendChild(cell);
        }
    }

    document.getElementById("status").innerText =
        `Turn: ${turn}`;
    document.getElementById("player").innerText =
        `You: ${me}`;
}

// ---------------- UTIL ----------------

function log(m){
    let d=document.createElement("div");
    d.textContent="> "+m;
    document.getElementById("log").appendChild(d);
}

window.copyLink = ()=>{
    navigator.clipboard.writeText(location.href);
    alert("Copied");
};

joinRoom();

</script>
</body>
</html>
